input {
  # Docker's built-in "gelf" logging driver sends container stdout/stderr
  # here over UDP. This is how app + nginx container logs reach the ELK
  # stack without needing a separate log-shipping agent.
  gelf {
    port => 12201
  }
}

filter {
  # The app emits JSON logs; GELF wraps the raw line in the "message" field.
  # Try to parse it as JSON so fields are searchable individually in Kibana.
  json {
    source => "message"
    skip_on_invalid_json => true
  }

  mutate {
    add_field => { "environment" => "local-docker" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }

  # Useful for debugging the pipeline itself: `docker logs logstash`
  stdout {
    codec => rubydebug
  }
}
