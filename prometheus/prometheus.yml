global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Prometheus scraping itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Sample app exposes /metrics via prom-client
  - job_name: "sample-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:5000"]
