worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Access logs go to stdout so `docker logs nginx` shows them too.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream sample_app {
        # "app" resolves via Docker's internal DNS on the shared network
        server app:5000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://sample_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://sample_app/health;
        }

        # Nginx's own health check endpoint for its Docker HEALTHCHECK
        location /nginx-health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
